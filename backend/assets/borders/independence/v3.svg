      <path d="M-15.6,-15.6 L-21.2,-21.2 M15.6,-15.6 L21.2,-21.2 M-15.6,15.6 L-21.2,21.2 M15.6,15.6 L21.2,21.2"/>
      <path d="M-8.4,-20.4 L-11.3,-27.6 M8.4,-20.4 L11.3,-27.6 M-20.4,-8.4 L-27.6,-11.3 M20.4,-8.4 L27.6,-11.3"/>
      <path d="M-8.4,20.4 L-11.3,27.6 M8.4,20.4 L11.3,27.6 M-20.4,8.4 L-27.6,11.3 M20.4,8.4 L27.6,11.3"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#604010" stroke-width="0.4"/>
    <use href="#goldStarLg" transform="translate(0,0) scale(0.6)"/>
  </g>

