<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08102a"/>
      <stop offset="50%" stop-color="#040818"/>
      <stop offset="100%" stop-color="#02040e"/>
    </linearGradient>
    <radialGradient id="goldStar" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="55%" stop-color="#e8c440"/>
      <stop offset="100%" stop-color="#604010"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b4f15"/>
      <stop offset="50%" stop-color="#f0d05a"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <radialGradient id="medallionG" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="50%" stop-color="#c89c2a"/>
      <stop offset="100%" stop-color="#3a2a08"/>
    </radialGradient>
  </defs>

  <path d="M 0,0 L 1000,0 L 1000,1500 L 0,1500 Z M 60,60 L 60,1440 L 940,1440 L 940,60 Z" fill="url(#frameBg)" fill-rule="evenodd"/>

  <g id="goldStarLg">
