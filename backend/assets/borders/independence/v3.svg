    <path d="M0,-20 L0,8 M-20,-6.1 L20,-6.1" stroke="#604010" stroke-width="0.3" opacity="0.5"/>
    <circle cx="-4" cy="-6" r="2" fill="#fff4b0" opacity="0.7"/>
  </g>

  <g id="goldStarMd">
