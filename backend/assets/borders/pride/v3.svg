  <path d="M 0,0 L 1000,0 L 1000,1500 L 0,1500 Z M 60,60 L 60,1440 L 940,1440 L 940,60 Z" fill="url(#frameBg)" fill-rule="evenodd"/>

  <g id="sunsetBandH">
    <rect x="0" y="0" width="120" height="5" fill="url(#warmRed)"/>
    <rect x="0" y="5" width="120" height="5" fill="url(#warmOrange)"/>
    <rect x="0" y="10" width="120" height="5" fill="url(#warmPink)"/>
    <rect x="0" y="15" width="120" height="5" fill="url(#warmMagenta)"/>
    <rect x="0" y="20" width="120" height="5" fill="url(#warmViolet)"/>
  </g>

  <g id="sunsetBandV">
    <rect x="0" y="0" width="5" height="120" fill="url(#warmRed)"/>
    <rect x="5" y="0" width="5" height="120" fill="url(#warmOrange)"/>
    <rect x="10" y="0" width="5" height="120" fill="url(#warmPink)"/>
    <rect x="15" y="0" width="5" height="120" fill="url(#warmMagenta)"/>
    <rect x="20" y="0" width="5" height="120" fill="url(#warmViolet)"/>
  </g>

  <g id="sunArc">
    <path d="M-30,0 A30,30 0 0,1 30,0" stroke="url(#warmRed)" stroke-width="3" fill="none"/>
    <path d="M-24,0 A24,24 0 0,1 24,0" stroke="url(#warmOrange)" stroke-width="3" fill="none"/>
    <path d="M-18,0 A18,18 0 0,1 18,0" stroke="url(#warmPink)" stroke-width="3" fill="none"/>
    <path d="M-12,0 A12,12 0 0,1 12,0" stroke="url(#warmMagenta)" stroke-width="3" fill="none"/>
    <path d="M-6,0 A6,6 0 0,1 6,0" stroke="url(#warmViolet)" stroke-width="3" fill="none"/>
  </g>

  <g id="sunDiscG">
    <circle cx="0" cy="0" r="12" fill="url(#sunDisc)" stroke="#a02828" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#f4a040" stroke-width="0.6" opacity="0.6"/>
    <circle cx="-4" cy="-4" r="3" fill="#fff0c0" opacity="0.6"/>
  </g>

  <g id="rayBurst">
    <g stroke="url(#warmOrange)" stroke-width="1.4" fill="none">
      <path d="M0,0 L0,-20 M0,0 L14,-14 M0,0 L20,0 M0,0 L14,14 M0,0 L0,20 M0,0 L-14,14 M0,0 L-20,0 M0,0 L-14,-14"/>
    </g>
    <circle cx="0" cy="0" r="2" fill="url(#sunDisc)"/>
  </g>

  <g id="warmDot">
    <circle cx="0" cy="0" r="2" fill="url(#warmPink)"/>
  </g>

