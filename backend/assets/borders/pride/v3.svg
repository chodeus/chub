<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#200810"/>
      <stop offset="50%" stop-color="#100408"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>
    <linearGradient id="sunsetH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a1830"/>
      <stop offset="25%" stop-color="#e0282a"/>
      <stop offset="50%" stop-color="#f08818"/>
      <stop offset="75%" stop-color="#ff6090"/>
      <stop offset="100%" stop-color="#8a1830"/>
    </linearGradient>
    <linearGradient id="sunsetV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a1830"/>
      <stop offset="25%" stop-color="#e0282a"/>
      <stop offset="50%" stop-color="#f08818"/>
      <stop offset="75%" stop-color="#ff6090"/>
      <stop offset="100%" stop-color="#8a1830"/>
    </linearGradient>
    <radialGradient id="sunDisc" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff0c0"/>
      <stop offset="50%" stop-color="#f4a040"/>
      <stop offset="100%" stop-color="#a02828"/>
    </radialGradient>
    <linearGradient id="warmRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a0810"/>
      <stop offset="100%" stop-color="#e0282a"/>
    </linearGradient>
    <linearGradient id="warmOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a3008"/>
      <stop offset="100%" stop-color="#f08818"/>
    </linearGradient>
    <linearGradient id="warmPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a02860"/>
      <stop offset="100%" stop-color="#ff80b0"/>
    </linearGradient>
    <linearGradient id="warmMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#702070"/>
      <stop offset="100%" stop-color="#e040a0"/>
    </linearGradient>
    <linearGradient id="warmViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#401860"/>
      <stop offset="100%" stop-color="#9038c8"/>
    </linearGradient>
