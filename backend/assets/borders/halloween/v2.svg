    <circle cx="0" cy="34" r="3" fill="url(#slime)" stroke="#1a4a00" stroke-width="0.6"/>
    <ellipse cx="-1" cy="-2" rx="3" ry="2" fill="#e8ff8a" opacity="0.4"/>
  </g>

  <g id="bat">
