<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051408"/>
      <stop offset="50%" stop-color="#020a04"/>
      <stop offset="100%" stop-color="#010402"/>
    </linearGradient>
    <radialGradient id="slime" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d8ff4a"/>
      <stop offset="55%" stop-color="#5ad800"/>
      <stop offset="100%" stop-color="#1a4a00"/>
    </radialGradient>
    <radialGradient id="slimeGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#e8ff8a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5ad800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a4a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="charcoalBranch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2820"/>
      <stop offset="50%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="slimeDrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ad800"/>
      <stop offset="60%" stop-color="#3ab000"/>
      <stop offset="100%" stop-color="#1a4a00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <path d="M 0,0 L 1000,0 L 1000,1500 L 0,1500 Z M 60,60 L 60,1440 L 940,1440 L 940,60 Z" fill="url(#frameBg)" fill-rule="evenodd"/>

  <g id="charcoalBranchG">
