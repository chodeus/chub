    <path d="M-14,0 C-14,-8 -8,-12 0,-12 C8,-12 14,-8 14,0 C14,8 8,12 0,12 C-8,12 -14,8 -14,0 Z" fill="url(#slime)" stroke="#1a4a00" stroke-width="0.7"/>
    <circle cx="-4" cy="-3" r="2" fill="#e8ff8a" opacity="0.7"/>
  </g>

  <g id="slimeDripG">
