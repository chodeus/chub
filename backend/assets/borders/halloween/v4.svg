<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#04040a"/>
    </linearGradient>
    <radialGradient id="ghost" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#dde0ea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a0a4b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ghost2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#bdc2cf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7a7e8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7e8c"/>
      <stop offset="60%" stop-color="#4a4e5c"/>
      <stop offset="100%" stop-color="#1a1c24"/>
    </linearGradient>
    <linearGradient id="fence" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5466"/>
      <stop offset="60%" stop-color="#2a2632"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8c0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#dac890" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a6a40" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <path d="M 0,0 L 1000,0 L 1000,1500 L 0,1500 Z M 60,60 L 60,1440 L 940,1440 L 940,60 Z" fill="url(#frameBg)" fill-rule="evenodd"/>

  <g id="ghostWisp">
