    <path d="M-12,18 L-12,-6 Q-12,-20 0,-20 Q12,-20 12,-6 L12,18" fill="none" stroke="#a0a4b0" stroke-width="0.4" opacity="0.6"/>
    <path d="M-2,-12 L2,-12 M0,-14 L0,-8" stroke="#1a1c24" stroke-width="1"/>
