    <path d="M-12,18 C-14,12 -14,2 -10,-8 C-6,-16 6,-16 10,-8 C14,2 14,12 12,18 L8,14 L4,18 L0,14 L-4,18 L-8,14 Z" fill="url(#ghost)"/>
    <ellipse cx="-4" cy="-4" rx="2.5" ry="3.5" fill="#1a1a22" opacity="0.6"/>
    <ellipse cx="4" cy="-4" rx="2.5" ry="3.5" fill="#1a1a22" opacity="0.6"/>
    <path d="M-2,4 Q0,6 2,4" stroke="#1a1a22" stroke-width="0.6" fill="none" opacity="0.5"/>
  </g>

  <g id="ghostWisp2">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="url(#ghost2)" filter="url(#softblur)"/>
    <path d="M-24,2 C-24,-8 -12,-10 0,-8 C12,-10 24,-8 28,0 C28,8 16,10 4,8 C4,12 -4,12 -8,8 C-14,10 -22,8 -24,2 Z" fill="url(#ghost2)"/>
  </g>

  <g id="tombstoneRound">
