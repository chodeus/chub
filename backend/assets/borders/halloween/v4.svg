    <rect x="-5" y="-3" width="10" height="12" fill="url(#lanternGlow)"/>
    <path d="M-6,-4 L6,-4 L4,-8 L-4,-8 Z" fill="#1a1a22" stroke="#3a3a44" stroke-width="0.4"/>
    <path d="M-4,-8 L-4,-12 Q0,-14 4,-12 L4,-8" stroke="#3a3a44" stroke-width="0.8" fill="none"/>
    <path d="M-4,-2 L4,-2 M-4,4 L4,4" stroke="#1a1a22" stroke-width="0.8"/>
    <path d="M0,-3 L0,8" stroke="#1a1a22" stroke-width="0.6"/>
    <ellipse cx="0" cy="3" rx="2" ry="3" fill="#fff8c0" opacity="0.8"/>
  </g>

  <g id="branchG">
