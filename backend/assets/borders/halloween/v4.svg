    <path d="M-3,-2 L0,-8 L3,-2 Z" fill="url(#fence)" stroke="#0a0810" stroke-width="0.3"/>
    <rect x="-12" y="6" width="24" height="2" fill="url(#fence)" stroke="#0a0810" stroke-width="0.2"/>
