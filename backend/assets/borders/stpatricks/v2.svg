      <stop offset="0%" stop-color="#0a1408"/>
      <stop offset="50%" stop-color="#050a04"/>
      <stop offset="100%" stop-color="#020402"/>
    </linearGradient>
    <linearGradient id="bronzeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2810"/>
      <stop offset="50%" stop-color="#b87830"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="bronzeStrokeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2810"/>
      <stop offset="50%" stop-color="#b87830"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
