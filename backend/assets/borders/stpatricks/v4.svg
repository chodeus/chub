      <stop offset="0%" stop-color="#04140a"/>
      <stop offset="50%" stop-color="#020a05"/>
      <stop offset="100%" stop-color="#010402"/>
    </linearGradient>
    <radialGradient id="coinGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="40%" stop-color="#f0c640"/>
      <stop offset="100%" stop-color="#604010"/>
    </radialGradient>
    <radialGradient id="coinRim" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f0c640" stop-opacity="0"/>
      <stop offset="90%" stop-color="#604010"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </radialGradient>
    <radialGradient id="emerald" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7ad078"/>
      <stop offset="55%" stop-color="#1a8028"/>
      <stop offset="100%" stop-color="#04401c"/>
    </radialGradient>
