name: "CodeQL & Lint"

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
      - 'frontend/**'
      - 'backend/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - 'deploy/docker/compose.yaml'
      - 'frontend/package-lock.json'
      - 'deploy/docker/Dockerfile'
      - '.dockerignore'
      - 'scripts/start.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/codeql-lint.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
      - 'frontend/**'
      - 'backend/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - 'deploy/docker/compose.yaml'
      - 'frontend/package-lock.json'
      - 'deploy/docker/Dockerfile'
      - '.dockerignore'
      - 'scripts/start.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/codeql-lint.yml'
  schedule:
    - cron: '25 4 * * 1'  # Weekly on Monday at 04:25 UTC

permissions:
  security-events: write
  contents: read
  packages: write

concurrency:
  group: codeql-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- CodeQL Analysis ----
  codeql-python:
    name: CodeQL - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: python
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: '/language:python'

  codeql-javascript:
    name: CodeQL - JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: '/language:javascript-typescript'

  # ---- Backend Lint ----
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff==0.15.11

      - name: Run Ruff linter
        run: ruff check .

  # ---- Backend Smoke Test & Tests ----
  backend-smoke:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Develop-only extensions keep their extra deps in requirements-*.txt
          # (e.g. requirements-cl2k.txt) so requirements.txt stays identical to
          # main. Install any that exist — no-op on main.
          for extra in requirements-*.txt; do
            if [ -e "$extra" ]; then pip install -r "$extra"; fi
          done
          # httpx is required by Starlette's TestClient (used in tests/test_api_smoke.py)
          # but isn't a runtime dep, so it lives outside requirements.txt.
          pip install httpx

      - name: Verify FastAPI app imports cleanly
        run: |
          mkdir -p templates/assets templates/icons templates/img templates/posters
          python -c "from backend.api.main import app; print('OK: ' + str(len(app.routes)) + ' routes loaded')"

      - name: Run tests
        run: python -m pytest tests/ -v

  # ---- Frontend Lint (reusable) ----
  frontend-lint:
    name: Frontend Lint
    uses: chodeus/chodeus-ops/.github/workflows/node-ci.yml@af17d8ce986da0b92cbdfc84d2170e199e34a3fb # main
    with:
      node_version: '24'
      package_json_dir: frontend
      run_lint: true
      run_stylelint: true
      run_prettier_check: true

  # ---- Branch isolation guard ----
  # Develop-only extensions (e.g. the CL2K poster maker) must never reach main.
  # On main (and PRs targeting main) fail if any extension code is present:
  # the extensions/ folders may hold only the generic loaders, and no file
  # named after a develop-only extension may exist anywhere in the tree.
  branch-isolation-guard:
    name: Branch Isolation Guard
    # Always runs (no job-level if) so it stays a satisfiable needs: dependency for
    # the docker jobs on every ref; the step below no-ops on non-main-bound refs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Fail if develop-only extension code is present
        run: |
          set -eu
          # Only main-bound refs must be extension-free; pass on any other ref.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_BASE_REF:-}" != "main" ]; then
            echo "Not a main-bound ref — branch-isolation check not applicable."
            exit 0
          fi
          leaks=$(git ls-files -- '*cl2k*' \
            'backend/extensions/*' ':!backend/extensions/__init__.py' \
            'frontend/src/extensions/*' ':!frontend/src/extensions/index.js')
          if [ -n "$leaks" ]; then
            echo "::error::Develop-only extension files found on a main-bound ref:"
            echo "$leaks"
            exit 1
          fi
          echo "OK: no develop-only extension code present."

  # ---- Docker Build (gated by all quality checks) ----
  docker-validate:
    name: Docker Validate (PR)
    if: github.event_name == 'pull_request'
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, branch-isolation-guard]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get branch name
        id: get_branch
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Set build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BRANCH=${{ steps.get_branch.outputs.BRANCH_NAME }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          push: false
          tags: chub:ci-${{ github.sha }}

  docker-push:
    name: Docker Build & Push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, branch-isolation-guard]
    runs-on: ubuntu-latest
    # Serialize with the release-please docker-version job so concurrent pushes
    # to the same :latest tag don't race on GHCR auth. cancel-in-progress is
    # false because both jobs publish artifacts we want to keep — they just
    # need to take turns pushing.
    concurrency:
      group: ghcr-push-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get the current branch name
        id: get_branch
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Set build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chub
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRANCH=${{ steps.get_branch.outputs.BRANCH_NAME }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  notify-failure:
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, branch-isolation-guard, docker-push]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@af17d8ce986da0b92cbdfc84d2170e199e34a3fb # main
    with:
      event_type: build
      status: failure
      title: "❌ Pipeline failed: ${{ github.ref_name }}"
      commit_sha: ${{ github.sha }}
    secrets: inherit
