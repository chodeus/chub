name: "CodeQL & Lint"

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
      - 'frontend/**'
      - 'backend/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - 'deploy/docker/compose.yaml'
      - 'frontend/package-lock.json'
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/**'
      - '.dockerignore'
      - 'scripts/start.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/codeql-lint.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
      - 'frontend/**'
      - 'backend/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - 'deploy/docker/compose.yaml'
      - 'frontend/package-lock.json'
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/**'
      - '.dockerignore'
      - 'scripts/start.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/codeql-lint.yml'
  schedule:
    - cron: '25 4 * * 1'  # Weekly on Monday at 04:25 UTC

permissions:
  contents: read

concurrency:
  group: codeql-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- CodeQL Analysis ----
  codeql-python:
    name: CodeQL - Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: '/language:python'

  codeql-javascript:
    name: CodeQL - JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: '/language:javascript-typescript'

  # ---- Backend Lint ----
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff==0.15.11

      - name: Run Ruff linter
        run: ruff check .

  # ---- Backend Smoke Test & Tests ----
  backend-smoke:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Develop-only extensions keep their extra deps in requirements-*.txt
          # (e.g. requirements-cl2k.txt) so requirements.txt stays identical to
          # main. Install any that exist — no-op on main.
          for extra in requirements-*.txt; do
            if [ -e "$extra" ]; then pip install -r "$extra"; fi
          done
          # httpx is required by Starlette's TestClient (used in tests/test_api_smoke.py)
          # but isn't a runtime dep, so it lives outside requirements.txt.
          pip install httpx

      - name: Verify FastAPI app imports cleanly
        run: |
          mkdir -p templates/assets templates/icons templates/img templates/posters
          python -c "from backend.api.main import app; print('OK: ' + str(len(app.routes)) + ' routes loaded')"

      - name: Run tests
        run: python -m pytest tests/ -v

  # ---- Frontend Lint (reusable) ----
  frontend-lint:
    name: Frontend Lint
    uses: chodeus/chodeus-ops/.github/workflows/node-ci.yml@aae195c19ec7069d2e91aca88107220ce807ef7e # main
    with:
      node_version: '24'
      package_json_dir: frontend
      run_lint: true
      run_stylelint: true
      run_prettier_check: true

  # ---- Frontend tests (Vitest) ----
  # Not folded into the reusable chodeus-ops node-ci.yml: that workflow has no
  # test input and is shared fleet-wide, so adding one there would need a
  # cross-repo change plus a SHA bump here.
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    # Narrower than the workflow-wide grant: this job runs repo-controlled npm
    # lifecycle scripts and test code, so it gets no token beyond reading.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test:run

  # ---- Branch isolation guard ----
  # Develop-only extensions (e.g. the CL2K poster maker) must never reach main.
  # On main (and PRs targeting main) fail if any extension code is present:
  # the extensions/ folders may hold only the generic loaders, and no file
  # named after a develop-only extension may exist anywhere in the tree.
  branch-isolation-guard:
    name: Branch Isolation Guard
    # Always runs (no job-level if) so it stays a satisfiable needs: dependency for
    # the docker jobs on every ref; the step below no-ops on non-main-bound refs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail if develop-only extension code is present
        run: |
          set -eu
          # Only main-bound refs must be extension-free; pass on any other ref.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_BASE_REF:-}" != "main" ]; then
            echo "Not a main-bound ref — branch-isolation check not applicable."
            exit 0
          fi
          # :(icase) — git globs are case-sensitive (else Cl2kMakerPage.jsx slips
          # through); cover both extensions dirs, poster_self_heal, and the fonts.
          leaks=$(git ls-files -- \
            ':(icase)*cl2k*' \
            ':(icase)*poster_self_heal*' ':(icase)*posterselfheal*' ':(icase)*posterheal*' \
            'backend/extensions/*' ':!backend/extensions/__init__.py' \
            'frontend/src/extensions/*' ':!frontend/src/extensions/index.js' \
            'deploy/docker/fonts/*')
          if [ -n "$leaks" ]; then
            echo "::error::Develop-only extension files found on a main-bound ref:"
            echo "$leaks"
            exit 1
          fi
          echo "OK: no develop-only extension code present."

  # ---- Develop invariant guard ----
  # Mirror of branch-isolation-guard for the develop half: develop may differ from
  # main ONLY by added files plus an append-only deploy/docker/Dockerfile.
  develop-invariant-guard:
    name: Develop Invariant Guard
    # Always runs (no job-level if) so it stays a satisfiable needs on every ref;
    # the step no-ops on non-develop-bound refs.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Assert develop only adds files (shared files byte-identical to main)
        run: |
          set -eu
          # Only develop-bound refs carry the extension delta; pass on any other ref.
          if [ "${GITHUB_REF}" != "refs/heads/develop" ] && [ "${GITHUB_BASE_REF:-}" != "develop" ]; then
            echo "Not a develop-bound ref — develop-invariant check not applicable."
            exit 0
          fi
          git fetch --quiet origin main
          # Merge-base diff (origin/main...HEAD): main being ahead of an unsynced
          # develop must not false-positive; only develop's own delta is inspected.
          bad=$(git diff origin/main...HEAD --name-status \
            | grep -Ev '^A[[:space:]]' \
            | grep -Ev '^M[[:space:]]+deploy/docker/Dockerfile$' || true)
          if [ -n "$bad" ]; then
            echo "::error::develop diverges from main beyond added files + an append-only Dockerfile:"
            echo "$bad"
            exit 1
          fi
          # Append-only = main's Dockerfile is an exact byte-PREFIX of develop's; a
          # mid-file insertion adds no `-` line, so a diff `^-` check would miss it.
          base="$(git merge-base origin/main HEAD)"
          base_df="$(mktemp)"
          git show "$base:deploy/docker/Dockerfile" > "$base_df"
          n=$(wc -c < "$base_df")
          if ! head -c "$n" deploy/docker/Dockerfile | cmp -s "$base_df" -; then
            echo "::error::deploy/docker/Dockerfile is not append-only vs main (mid-file edit or removal); develop must only append CL2K layers."
            exit 1
          fi
          echo "OK: develop differs from main only by added files + append-only Dockerfile."

  # ---- Docker Build (gated by all quality checks) ----
  docker-validate:
    name: Docker Validate (PR)
    if: github.event_name == 'pull_request'
    # frontend-tests is deliberately NOT here: it is not a required check, and a
    # needs-failure SKIPS this job — which GitHub reports as Success for a
    # required check, turning a hard gate into a free pass. Promote
    # "Frontend Tests" in branch protection to make it block instead.
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, branch-isolation-guard, develop-invariant-guard]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get branch name
        id: get_branch
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Set build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BRANCH=${{ steps.get_branch.outputs.BRANCH_NAME }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          push: false
          tags: chub:ci-${{ github.sha }}

  docker-push:
    name: Docker Build & Push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, frontend-tests, branch-isolation-guard, develop-invariant-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45  # see release-please.yml docker-version
    permissions:
      contents: read
      packages: write
    # Serialize with the release-please docker-version job so concurrent pushes
    # to the same :latest tag don't race on GHCR auth. cancel-in-progress is
    # false because both jobs publish artifacts we want to keep — they just
    # need to take turns pushing.
    concurrency:
      group: ghcr-push-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get the current branch name
        id: get_branch
        run: |
          name="${GITHUB_REF#refs/heads/}"
          # Emit a branch tag only on branch refs; encode it collision-safe to
          # match on-branch-create/delete (clean names pass through, else digest).
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then IS_BRANCH=true; else IS_BRANCH=false; fi
          sanitized="${name//[^A-Za-z0-9_.-]/-}"
          sanitized="$(printf '%s' "$sanitized" | sed -E 's/^[.-]+//')"
          if [ "$sanitized" = "$name" ] && [ -n "$sanitized" ]; then
            BRANCH_TAG="$sanitized"
          else
            hash="$(printf '%s' "$name" | sha256sum | cut -c1-12)"
            base="${sanitized:0:100}"; [ -n "$base" ] || base="branch"
            BRANCH_TAG="${base}-${hash}"
          fi
          echo "BRANCH_NAME=${name}" >> "$GITHUB_OUTPUT"
          echo "BRANCH_TAG=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "IS_BRANCH=${IS_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Set build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chub
          tags: |
            type=raw,value=${{ steps.get_branch.outputs.BRANCH_TAG }},enable=${{ steps.get_branch.outputs.IS_BRANCH }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRANCH=${{ steps.get_branch.outputs.BRANCH_NAME }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  notify-failure:
    needs: [codeql-python, codeql-javascript, backend-lint, backend-smoke, frontend-lint, frontend-tests, branch-isolation-guard, develop-invariant-guard, docker-push]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@aae195c19ec7069d2e91aca88107220ce807ef7e # main
    with:
      event_type: build
      status: failure
      title: "❌ Pipeline failed: ${{ github.ref_name }}"
      commit_sha: ${{ github.sha }}
    secrets: inherit
