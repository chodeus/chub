name: Validate workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        id: install
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        # Release tarball checked against its published checksums; no remote script runs.
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/${sums}"
          grep " ${tarball}\$" "${sums}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          echo "exe=$PWD/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        shell: bash
        env:
          # Skip shellcheck info/style findings; real bugs still fail.
          SHELLCHECK_OPTS: --severity=warning
        run: ${{ steps.install.outputs.exe }} -color
