name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@44b9463f55b6d28ca72a126bdc3a89ce6b472166 # main

  docker-version:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Shares a concurrency group with codeql-lint.yml's docker-push so the two
    # jobs serialize on the :latest tag push instead of racing on GHCR auth.
    concurrency:
      group: ghcr-push-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout at new tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRANCH=main
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/chub:latest
