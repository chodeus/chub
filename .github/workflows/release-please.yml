name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@579feb04e3219248963bd27843298a8c2ea6b2fd # main

  docker-version:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Normal multi-arch build is ~13-17m. Without this a wedged build sits on the
    # 6h default (and holds the ghcr-push group, queueing every later push).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # Shares a concurrency group with codeql-lint.yml's docker-push so the two
    # jobs serialize on the :latest tag push instead of racing on GHCR auth.
    concurrency:
      group: ghcr-push-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout at new tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (lean)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          # Explicit: the bare default is only lean while `runtime` stays the
          # final stage in the Dockerfile.
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRANCH=main
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/chub:latest

      - name: Build and push (full)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRANCH=main
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.tag_name }}-full
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.version }}-full
            ghcr.io/${{ github.repository_owner }}/chub:full
