name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # release-please.yml approves its release PR's CI runs.
  actions: write
  packages: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@1fcf653ea7ccc8c3cc5b8897d38c4b3f640010c0 # main

  docker-version:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Normal multi-arch build is ~13-17m. Without this a wedged build sits on the
    # 6h default (and holds the ghcr-push group, queueing every later push).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # Shares a concurrency group with codeql-lint.yml's docker-push so the two
    # jobs serialize on the :latest tag push instead of racing on GHCR auth.
    concurrency:
      group: ghcr-push-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout at new tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Without this the release build stamps an empty BUILD_NUMBER, and
      # version.py's update check reads it from :latest/:full — see codeql-lint.yml.
      - name: Set build number
        run: |
          count=$(git rev-list --count HEAD)
          # Bare `echo "X=$(...)"` exits 0 on a failed substitution, which would
          # silently re-ship the unversioned image this step exists to prevent.
          [ -n "$count" ] || { echo "::error::empty commit count at ${{ needs.release.outputs.tag_name }}"; exit 1; }
          echo "BUILD_NUMBER=$count" >> "$GITHUB_ENV"
          echo "PACKAGES_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every platform that gets published is scanned. buildx cannot load a
      # multi-arch manifest, so each arch is built and loaded separately; the
      # pushes below reuse both from the gha cache, so nothing is built twice.
      # Scopes are per target AND per arch so the full export cannot clobber
      # lean's and leave the lean publish missing its own cache.
      - name: Build lean amd64 for scanning
        id: lean_amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chub,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BRANCH=main
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            PACKAGES_DATE=${{ env.PACKAGES_DATE }}
          cache-from: type=gha,scope=lean-amd64
          cache-to: type=gha,mode=max,scope=lean-amd64

      - name: Scan lean amd64
        uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/chub@${{ steps.lean_amd64.outputs.digest }}
          label: lean-amd64
          platform: linux/amd64

      # The native leg only: under QEMU the arm64 app takes minutes to come
      # up and the wait would fail for the emulator, not the image.
      - name: Smoke test lean amd64
        uses: ./.github/actions/smoke-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/chub@${{ steps.lean_amd64.outputs.digest }}

      - name: Build lean arm64 for scanning
        id: lean_arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: runtime
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chub,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BRANCH=main
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            PACKAGES_DATE=${{ env.PACKAGES_DATE }}
          cache-from: type=gha,scope=lean-arm64
          cache-to: type=gha,mode=max,scope=lean-arm64

      - name: Scan lean arm64
        uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/chub@${{ steps.lean_arm64.outputs.digest }}
          label: lean-arm64
          platform: linux/arm64

      - name: Build full amd64 for scanning
        id: full_amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: full
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chub,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BRANCH=main
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            PACKAGES_DATE=${{ env.PACKAGES_DATE }}
          cache-from: type=gha,scope=full-amd64
          cache-to: type=gha,mode=max,scope=full-amd64

      - name: Scan full amd64
        uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/chub@${{ steps.full_amd64.outputs.digest }}
          label: full-amd64
          platform: linux/amd64

      - name: Build full arm64 for scanning
        id: full_arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: full
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chub,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BRANCH=main
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            PACKAGES_DATE=${{ env.PACKAGES_DATE }}
          cache-from: type=gha,scope=full-arm64
          cache-to: type=gha,mode=max,scope=full-arm64

      - name: Scan full arm64
        uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/chub@${{ steps.full_arm64.outputs.digest }}
          label: full-arm64
          platform: linux/arm64

      # Assemble the published tags from the exact digests the gates passed. A
      # second build could differ from the scanned one on a cache miss.
      - name: Publish the scanned lean digests
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/chub
          DIGEST_AMD64: ${{ steps.lean_amd64.outputs.digest }}
          DIGEST_ARM64: ${{ steps.lean_arm64.outputs.digest }}
          TAGS: |
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/chub:latest
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$REPO@$DIGEST_AMD64" "$REPO@$DIGEST_ARM64"

      # Assemble the published tags from the exact digests the gates passed. A
      # second build could differ from the scanned one on a cache miss.
      - name: Publish the scanned full digests
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/chub
          DIGEST_AMD64: ${{ steps.full_amd64.outputs.digest }}
          DIGEST_ARM64: ${{ steps.full_arm64.outputs.digest }}
          TAGS: |
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.tag_name }}-full
            ghcr.io/${{ github.repository_owner }}/chub:${{ needs.release.outputs.version }}-full
            ghcr.io/${{ github.repository_owner }}/chub:full
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$REPO@$DIGEST_AMD64" "$REPO@$DIGEST_ARM64"