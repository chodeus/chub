name: "Dependency Audit"

# OSV scan of the shipped dependency manifests, weekly and on any manifest change.
# Findings go to the Security tab (SARIF) and fail the run.

# No Dockerfile in paths: this scans lockfiles, not base images.
# Actions has no YAML anchors, so keep both path lists identical.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-cl2k.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dep-audit.yml"
  # main has required_pr=false, so a manifest can land without ever seeing a PR.
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-cl2k.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dep-audit.yml"

permissions: {}

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      # Least-privilege for the reusable workflow: SARIF upload + checkout.
      actions: read
      contents: read
      security-events: write
    with:
      # Only what ships: backend pins (both images) + frontend lockfile. refs/
      # holds vendored reference repos and must not be scanned.
      scan-args: |-
        -L
        requirements.txt
        -L
        requirements-cl2k.txt
        -L
        frontend/package-lock.json
      fail-on-vuln: true
