name: "Dependency Audit"

# Live OSV scan of the dependencies the release actually ships. Renovate keeps
# versions fresh but never checks advisories; this is the vulnerability gate.
# Weekly + on every change to an audited manifest, however it lands. Findings
# land in the Security tab (SARIF) and fail the run.

# No Dockerfile in the paths below: this job scans lockfiles, not container base
# images, so triggering on it would imply base-image coverage it lacks.
# Actions has no YAML anchors, so the path list is repeated verbatim.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-cl2k.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dep-audit.yml"
  # main has required_pr=false, so a manifest can land without ever seeing a PR.
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-cl2k.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dep-audit.yml"

permissions: {}

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      # Least-privilege for the reusable workflow: SARIF upload + checkout.
      actions: read
      contents: read
      security-events: write
    with:
      # Only what ships: backend pins (both images) + frontend lockfile. refs/
      # holds vendored reference repos and must not be scanned.
      scan-args: |-
        -L
        requirements.txt
        -L
        requirements-cl2k.txt
        -L
        frontend/package-lock.json
      fail-on-vuln: true
