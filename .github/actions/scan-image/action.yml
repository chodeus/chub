name: Scan a built image
description: Report fixable findings without blocking, then fail on a fixable CRITICAL.

inputs:
  image-ref:
    description: Locally loaded image to scan.
    required: true
  label:
    description: Name for this image in the job summary, e.g. lean or full.
    required: true
  report-severity:
    description: Severities listed in the job summary without failing.
    required: false
    default: CRITICAL,HIGH
  gate-severity:
    description: Severities that fail the build.
    required: false
    default: CRITICAL

runs:
  using: composite
  steps:
    # ignore-unfixed on both tiers: a base image carries CVEs with no fix, and
    # blocking on those wedges every build on something no change here clears.
    - name: Report
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        # The action's default trivy trails its own releases; pin the scanner.
        version: v0.74.0 # renovate: aquasecurity/trivy
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        severity: ${{ inputs.report-severity }}
        ignore-unfixed: true
        exit-code: '0'
        format: table
        output: trivy-${{ inputs.label }}.txt

    - name: Publish to the job summary
      if: always()
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        REPORT_SEVERITY: ${{ inputs.report-severity }}
      run: |
        {
          echo "### Image scan — ${LABEL} (fixable ${REPORT_SEVERITY})"
          echo '```'
          cat "trivy-${LABEL}.txt" 2>/dev/null || echo "(no report produced)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Gate
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.74.0 # renovate: aquasecurity/trivy
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        severity: ${{ inputs.gate-severity }}
        ignore-unfixed: true
        exit-code: '1'
        format: table
        # The report step above already installed trivy in this job.
        skip-setup-trivy: true
