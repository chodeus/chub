# Time-boxed exception, reviewed 2026-07-27. Not a way to silence the scanner:
# it names one advisory, states why it is unreachable here, and expires so it
# comes back rather than being forgotten.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-27
reason = """brace-expansion DoS via unbounded expansion. Dev-only and not
reachable here, and there is currently no fix that keeps the lint toolchain
working.

Reachability: exploiting it needs attacker-controlled brace patterns passed to
expand(). The only path is eslint-plugin-react -> minimatch@3 -> brace-expansion
1.1.x, where the patterns come from our own eslint config. The package is a
devDependency and never ships in the image.

Why it is not simply fixed (all three tried and reverted, 2026-07-27):
  * The advisory is one range, 0 -> 5.0.8, with no backports. Published lines are
    1.1.16 / 2.1.2 / 3.0.3 / 4.0.1 / 5.0.8, so 5.0.8 is the only safe release.
  * Overriding brace-expansion to 5.0.8 breaks minimatch@3, which calls it as a
    default export: "TypeError: expand is not a function". eslint stops running.
  * Overriding minimatch to v10 turns the board green but is a latent crash: v10
    exports an object, and eslint-plugin-react (no-danger.js:83 and four other
    rules) calls minimatch(name, pattern) directly.
  * eslint-plugin-react 7.37.5 is the latest release, still pins minimatch ^3.1.2,
    and its eslint peer range stops at ^9.7 — so it also blocks the eslint 10
    upgrade that would otherwise move the rest of the tree to minimatch 10.

Revisit when eslint-plugin-react adopts minimatch 10; Renovate will surface it."""
